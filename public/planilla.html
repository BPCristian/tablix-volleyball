<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planilla Digital Arbitral — TABLIX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light p-3">
  <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 780px;">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
      <h5 class="fw-bold mb-0">📋 Planilla Oficial de Mesa — Voleibol</h5>
      <span id="matchBadge" class="badge bg-primary"></span>
    </div>
    <div class="row text-center mb-3">
      <div class="col-5"><h5 id="nameA" class="fw-bold text-primary">Equipo A</h5></div>
      <div class="col-2 fw-bold text-muted">VS</div>
      <div class="col-5"><h5 id="nameB" class="fw-bold text-danger">Equipo B</h5></div>
    </div>
    <div id="setsLive" class="vstack gap-2 mb-3"></div>
    <div class="d-flex justify-content-between">
      <button class="btn btn-outline-secondary btn-sm" onclick="window.close()">Cerrar Planilla</button>
      <button class="btn btn-success btn-sm" onclick="syncToServer()">✅ Sincronizar Resultado Oficial al Torneo</button>
    </div>
    <div id="syncMsg" class="mt-2"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const matchId = params.get('matchId');
    document.getElementById('matchBadge').textContent = 'Encuentro ' + (matchId || '');
    document.getElementById('nameA').textContent = params.get('teamA') || 'Equipo A';
    document.getElementById('nameB').textContent = params.get('teamB') || 'Equipo B';

    const container = document.getElementById('setsLive');
    for (let i = 1; i <= 5; i++) {
      container.innerHTML += `<div class="row g-2 align-items-center border rounded p-2">
        <div class="col-3 fw-bold">Set ${i}</div>
        <div class="col-4"><input type="number" id="pa-${i}" class="form-control form-control-sm text-center" placeholder="Puntos A" min="0"></div>
        <div class="col-1 text-center">-</div>
        <div class="col-4"><input type="number" id="pb-${i}" class="form-control form-control-sm text-center" placeholder="Puntos B" min="0"></div>
      </div>`;
    }

    async function syncToServer() {
      const user = JSON.parse(localStorage.getItem('tablix_user') || 'null');
      const sets = [];
      for (let i = 1; i <= 5; i++) {
        sets.push({ a: document.getElementById('pa-' + i).value, b: document.getElementById('pb-' + i).value });
      }
      try {
        const res = await fetch('/api/matches/' + matchId + '/score', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-user-role': user ? user.role : 'ARBITRO',
            'x-user-id': user ? user.id : 'u-arb-1'
          },
          body: JSON.stringify({ sets })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById('syncMsg').innerHTML = '<div class="alert alert-success py-2">' + data.message + ' (Recargue la ventana principal para ver la tabla actualizada).</div>';
      } catch (err) {
        document.getElementById('syncMsg').innerHTML = '<div class="alert alert-danger py-2">' + err.message + '</div>';
      }
    }
  </script>
</body>
</html>
